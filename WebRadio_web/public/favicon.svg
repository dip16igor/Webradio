<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Radio icon -->
  <rect x="10" y="30" width="80" height="50" rx="10" fill="#2c3e50"/>
  <rect x="15" y="35" width="70" height="40" rx="5" fill="#34495e"/>
  
  <!-- Speaker -->
  <circle cx="30" cy="55" r="8" fill="#95a5a6"/>
  <circle cx="30" cy="55" r="4" fill="#2c3e50"/>
  
  <!-- Radio waves -->
  <path d="M 45 50 Q 50 45, 55 50 T 65 50" stroke="#3498db" stroke-width="2" fill="none"/>
  <path d="M 45 60 Q 50 65, 55 60 T 65 60" stroke="#3498db" stroke-width="2" fill="none"/>
  
  <!-- Antenna -->
  <line x1="50" y1="30" x2="50" y2="10" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="10" r="3" fill="#e74c3c"/>
  
  <!-- Control buttons -->
  <circle cx="70" cy="45" r="3" fill="#3498db"/>
  <circle cx="80" cy="45" r="3" fill="#3498db"/>
  <circle cx="70" cy="65" r="3" fill="#3498db"/>
  <circle cx="80" cy="65" r="3" fill="#3498db"/>
</svg>