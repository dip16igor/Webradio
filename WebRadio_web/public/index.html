<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>ESP32 WebRadio Control</title>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="stylesheet" href="leaflet.css?v=1">
    <script src="theme.js"></script>
</head>

<body>
    <div class="container">

        <div class="page-header">
            <h1>ESP32 WebRadio</h1>
            <div class="header-links header-actions">
                <button data-theme-btn class="icon-btn" title="Тёмная / светлая тема">🌙</button>
                <a class="admin-link" href="alarm.html" title="Wake-up schedule">Alarm</a>
                <a class="admin-link" href="stats.html" title="Listening statistics">Statistics</a>
                <a class="admin-link" href="admin.html" title="Add, remove, reorder stations">Station Manager</a>
                <a class="admin-link" href="pub.html" title="Public player with own stations">Public player</a>
            </div>
        </div>

        <div class="card map-card" id="now-card">
            <div class="now-top">
                <div class="now-left">
                    <div id="station" class="now-station">N/A</div>
                    <div id="title" class="now-track">N/A</div>
                </div>
                <div class="now-right">
                    <div class="now-leds"><span id="ind-power" class="led"><i></i>PWR</span><span id="ind-slp" class="led"><i></i>SLP</span></div>
                    <div class="now-volrow">
                        <span id="volume-icon"></span>
                        <span id="volume" class="now-vol">N/A</span>
                    </div>
                    <div class="now-alarmrow">⏰ <span id="alarm">N/A</span></div>
                </div>
            </div>
            <div class="now-mapwrap">
                <div id="idx-map"></div>
                <div class="now-bottombar">
                    <span id="now-params">—</span>
                    <span class="now-center"><span id="idx-loc"></span></span>
                    <span class="now-rightside"><span id="dropouts" class="now-drop">N/A</span></span>
                </div>
            </div>
            <div class="now-log">Log:&nbsp;<span id="log">Connecting...</span></div>
        </div>

        <div id="status-container" class="status-offline" hidden>
            <h2>Status:&nbsp;<span id="state">Offline</span></h2>
        </div>

        <div class="controls-grid">
            <button id="btn-power" class="btn btn-danger">POWER</button>
            <button id="btn-sleep" class="btn">SLEEP</button>
            <button id="btn-vol-down" class="btn">VOL -</button>
            <button id="btn-vol-up" class="btn">VOL +</button>
            <button id="btn-ch-down" class="btn">CH -</button>
            <button id="btn-ch-up" class="btn">CH +</button>
        </div>

        <h2>Preset Stations</h2>
        <div class="station-row">
            <div class="card station-card">
                <div id="station-selector" class="station-selector">
                    <div id="station-wheel" class="station-wheel">
                        <!-- Station items will be generated by JS -->
                    </div>
                </div>
            </div>
            <div class="card cover-card">
                <img id="idx-cover" class="cover-img" src="radio.svg" alt="cover">
            </div>
        </div>

        <h2>Alarm Clock</h2>
        <div class="alarm-controls">
            <input type="time" id="alarm-time" class="alarm-time">
            <button id="btn-set-alarm" class="btn">Set Alarm</button>
            <button id="btn-cancel-alarm" class="btn btn-danger">Cancel Alarm</button>
        </div>

    </div>

    <script src="app.js"></script>
    <script src="leaflet.js?v=1"></script>
    <script src="index-map.js"></script>
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW registration failed:', err));
    });
}
</script>
</body>

</html>
