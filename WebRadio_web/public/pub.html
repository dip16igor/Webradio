<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRadio — публичный плеер</title>
    <link rel="manifest" href="pub-manifest.json">
    <meta name="theme-color" content="#141414">
    <link rel="icon" href="radio.svg" type="image/svg+xml">
    <script>
        try {
            const t = localStorage.getItem('pub_theme');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* noop */ }
    </script>
    <style>
        :root, [data-theme="dark"] {
            --bg: #141414;
            --card: #1e1e1e;
            --card-border: #333;
            --text: #e8e8e8;
            --muted: #999;
            --accent: #7ddb9b;
            --accent-dim: #1d5c33;
            --danger: #e06c6c;
            --input-bg: #111;
            --input-border: #444;
            --row-hover: #262626;
            --row-playing: #1d3a26;
        }
        [data-theme="light"] {
            --bg: #f2f2f2;
            --card: #ffffff;
            --card-border: #ddd;
            --text: #222;
            --muted: #666;
            --accent: #1d7c3f;
            --accent-dim: #bfe6cc;
            --danger: #c0392b;
            --input-bg: #fff;
            --input-border: #bbb;
            --row-hover: #f0f0f0;
            --row-playing: #dff0e3;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            margin: 0;
            padding: 16px;
            max-width: 860px;
            margin-left: auto;
            margin-right: auto;
        }
        .pub-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .pub-header h1 { font-size: 20px; margin: 0; flex: 1; }
        .pub-header .user { color: var(--muted); font-size: 13px; }
        .icon-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
        }
        .icon-btn:hover { border-color: var(--accent); }
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .card h2 { margin: 0 0 10px 0; font-size: 15px; color: var(--muted); font-weight: 600; }
        .auth-form { display: flex; flex-direction: column; gap: 8px; max-width: 340px; }
        .auth-form input, .add-form input {
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 14px;
        }
        .btn {
            background: var(--accent-dim);
            color: var(--text);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 14px;
        }
        [data-theme="light"] .btn { color: #14532d; }
        .btn:hover { filter: brightness(1.15); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn.small { padding: 4px 8px; font-size: 12px; }
        .auth-toggle { font-size: 13px; color: var(--muted); }
        .auth-toggle a { color: var(--accent); cursor: pointer; }
        .auth-error { color: var(--danger); font-size: 13px; min-height: 18px; }
        .player-top { display: flex; gap: 14px; }
        .cover {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            object-fit: cover;
            background: #000;
            flex: none;
        }
        .player-info { flex: 1; min-width: 0; }
        .track-name {
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
        .controls { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
        .controls .btn { font-size: 16px; padding: 8px 14px; }
        .vol { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
        .vol input[type="range"] { flex: 1; accent-color: var(--accent); }
        #pub-spectrum { width: 100%; height: 72px; display: block; }
        .spec-head { position: relative; display: flex; align-items: center; }
        .spec-head h2 { flex: 1; }
        .spec-menu-btn {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 8px;
            line-height: 1.4;
        }
        .spec-menu-btn:hover { color: var(--text); border-color: var(--accent); }
        .spec-menu {
            position: absolute;
            top: 30px;
            right: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 250px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            padding: 10px 12px;
            font-size: 11px;
            color: var(--muted);
        }
        .spec-menu[hidden] { display: none; }
        .spec-menu label { display: grid; grid-template-columns: 62px 1fr 48px; gap: 8px; align-items: center; white-space: nowrap; }
        .spec-menu input[type="range"] { width: 100%; accent-color: var(--accent); height: 16px; }
        .spec-menu span { color: var(--text); text-align: right; }
        #st-list { max-height: 320px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent; }
        #st-list::-webkit-scrollbar { width: 10px; }
        #st-list::-webkit-scrollbar-track { background: transparent; }
        #st-list::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 5px; border: 2px solid var(--card); }
        #st-list::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        .st-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .st-row:hover { background: var(--row-hover); }
        .st-row.playing { background: var(--row-playing); }
        .st-row .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .st-row .genre { color: var(--muted); font-size: 12px; }
        .st-row .ops { display: flex; gap: 4px; }
        .st-row .ops button {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
        }
        .st-row .ops button:hover { color: var(--text); border-color: var(--accent); }
        .add-form { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .add-form input[name="name"] { flex: 2; min-width: 140px; }
        .add-form input[name="url"] { flex: 3; min-width: 200px; }
        .add-form input[name="genre"] { flex: 1; min-width: 90px; }
        .edit-row { display: flex; gap: 6px; width: 100%; }
        .edit-row input { flex: 1; min-width: 0; background: var(--input-bg); color: var(--text); border: 1px solid var(--accent); border-radius: 4px; padding: 4px 6px; font-size: 13px; }
        .status { color: var(--muted); font-size: 13px; }
        [hidden] { display: none !important; }
        @media (max-width: 560px) {
            .player-top { flex-direction: column; }
            .cover { width: 100%; height: auto; aspect-ratio: 1/1; }
        }
    </style>
</head>
<body>
    <div class="pub-header">
        <h1>WebRadio</h1>
        <span id="pub-user" class="user" hidden></span>
        <button id="theme-btn" class="icon-btn" title="Тёмная / светлая тема">🌙</button>
        <button id="logout-btn" class="icon-btn" title="Выйти" hidden>⏻</button>
    </div>

    <div id="auth-card" class="card" hidden>
        <h2 id="auth-title">Вход</h2>
        <div class="auth-form">
            <input id="auth-login" type="text" placeholder="Логин" autocomplete="username" maxlength="32">
            <input id="auth-pass" type="password" placeholder="Пароль" autocomplete="current-password">
            <input id="auth-invite" type="text" placeholder="Инвайт-код" hidden>
            <div id="auth-error" class="auth-error"></div>
            <button id="auth-go" class="btn">Войти</button>
            <div class="auth-toggle"><span id="auth-toggle-text">Нет аккаунта?</span> <a id="auth-toggle">Регистрация</a></div>
        </div>
    </div>

    <div id="player-card" class="card" hidden>
        <div class="player-top">
            <img id="pub-cover" class="cover" src="radio.svg" alt="cover">
            <div class="player-info">
                <div id="pub-track" class="track-name">—</div>
                <div id="pub-meta" class="track-meta">—</div>
                <div class="controls">
                    <button id="btn-prev" class="btn" title="Предыдущая">⏮</button>
                    <button id="btn-play" class="btn" title="Слушать / стоп">▶</button>
                    <button id="btn-next" class="btn" title="Следующая">⏭</button>
                </div>
                <div class="vol">🔊 <input id="pub-vol" type="range" min="0" max="100" value="80"></div>
            </div>
        </div>
    </div>

    <div id="spec-card" class="card" hidden>
        <div class="spec-head">
            <h2>Спектр</h2>
            <button id="spec-menu-btn" class="spec-menu-btn" title="Настройки спектра">⋮</button>
            <div id="spec-menu" class="spec-menu" hidden>
                <label title="Верх шкалы в дБFS">Верх, дБ <input id="p-tune-dbmax" type="range" min="-30" max="0" step="1" value="-6"><span id="p-tune-dbmax-v">−6</span></label>
                <label title="Низ шкалы в дБFS">Низ, дБ <input id="p-tune-dbmin" type="range" min="-120" max="-40" step="1" value="-80"><span id="p-tune-dbmin-v">−80</span></label>
                <label title="Время падения пикового индикатора на всю шкалу">Пики <input id="p-tune-grav" type="range" min="0.2" max="2" step="0.1" value="0.6"><span id="p-tune-grav-v">0.6 с</span></label>
                <label title="Время нарастания столбика на всю шкалу (0 — мгновенно)">Атака <input id="p-tune-atk" type="range" min="0" max="900" step="10" value="0"><span id="p-tune-atk-v">0 мс</span></label>
                <label title="Время спада столбика на всю шкалу (0 — мгновенно)">Спад <input id="p-tune-rel" type="range" min="0" max="900" step="10" value="0"><span id="p-tune-rel-v">0 мс</span></label>
                <label title="Размер FFT анализатора">FFT <input id="p-tune-fft" type="range" min="0" max="5" step="1" value="4"><span id="p-tune-fft-v">4096</span></label>
                <label title="Количество столбиков">Столбики <input id="p-tune-bars" type="range" min="16" max="96" step="8" value="48"><span id="p-tune-bars-v">48</span></label>
            </div>
        </div>
        <canvas id="pub-spectrum"></canvas>
    </div>

    <div id="list-card" class="card" hidden>
        <h2>Станции <span id="st-count" class="status"></span></h2>
        <div id="st-list"></div>
        <div class="add-form">
            <input name="name" type="text" placeholder="Название" maxlength="60">
            <input name="url" type="text" placeholder="http(s)://…">
            <input name="genre" type="text" placeholder="Жанр" maxlength="40">
            <button id="btn-add" class="btn">＋</button>
        </div>
        <div id="list-error" class="auth-error"></div>
    </div>

    <audio id="pub-audio" preload="none"></audio>
    <script src="pub.js?v=4"></script>
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    });
}
</script>
</body>
</html>
